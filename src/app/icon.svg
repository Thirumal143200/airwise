<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.3" />

  <!-- Protective Wind Rings (Atmospheric Circulation) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.3" />

  <!-- Dynamic Wind Gusts (Upper Breeze) -->
  <path d="M 120 180 C 180 140, 280 140, 340 180 C 370 200, 390 190, 390 170 C 390 150, 370 140, 350 140" fill="none" stroke="url(#windGrad)" stroke-width="16" stroke-linecap="round" />
  
  <!-- Dynamic Wind Gusts (Middle Breeze) -->
  <path d="M 90 230 C 160 190, 270 190, 320 230 C 340 245, 360 245, 360 230 C 360 215, 345 205, 330 205" fill="none" stroke="url(#windGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Botanical Leaf Symbol (Pure Clean Air & Resilience) -->
  <path d="M 256 160 C 340 210, 350 320, 270 380 C 230 410, 170 390, 160 340 C 150 280, 200 190, 256 160 Z" fill="url(#leafGrad)" stroke="#a7f3d0" stroke-width="6" />

  <!-- Leaf Vein & Vitality Arc -->
  <path d="M 256 170 C 240 260, 220 320, 170 355" fill="none" stroke="#ecfdf5" stroke-width="8" stroke-linecap="round" />
  <path d="M 235 250 C 265 245, 295 260, 310 280" fill="none" stroke="#ecfdf5" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 220 295 C 245 295, 265 315, 275 335" fill="none" stroke="#ecfdf5" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Air Sensor Sparkle (AI Intelligence) -->
  <path d="M 370 290 Q 370 320, 340 320 Q 370 320, 370 350 Q 370 320, 400 320 Q 370 320, 370 290 Z" fill="#6ee7b7" filter="url(#glow)" />
</svg>