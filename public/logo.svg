<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="440" height="96">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="logoLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="logoWind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#logoBgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
    <!-- Wind breeze -->
    <path d="M 18 32 C 30 24, 46 24, 56 30 C 62 34, 66 32, 66 28" fill="none" stroke="url(#logoWind)" stroke-width="3" stroke-linecap="round" />
    <path d="M 14 42 C 26 34, 44 34, 52 40 C 56 44, 60 44, 60 40" fill="none" stroke="url(#logoWind)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Leaf -->
    <path d="M 44 26 C 58 35, 60 54, 46 64 C 38 70, 28 66, 26 58 C 24 48, 34 32, 44 26 Z" fill="url(#logoLeaf)" stroke="#a7f3d0" stroke-width="1.5" />
    <path d="M 44 28 C 40 44, 36 54, 28 60" fill="none" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round" />
    <!-- Sparkle -->
    <path d="M 64 52 Q 64 58, 58 58 Q 64 58, 64 64 Q 64 58, 70 58 Q 64 58, 64 52 Z" fill="#6ee7b7" />
  </g>

  <!-- Typography -->
  <text x="108" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="url(#logoTextGrad)">
    Air<tspan fill="#059669">Wise</tspan>
  </text>
  
  <text x="110" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#4b5563" text-transform="uppercase">
    Urban Air Quality Intelligence
  </text>
</svg>